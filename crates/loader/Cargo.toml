[package]
name = "governor_loader"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "governor_loader"
path = "src/main.rs"
# There is no std here, so there is no test harness either. Without these two
# lines, `cargo test` and rust-analyzer's all-targets check try to build one.
test = false
bench = false

[dependencies]
# No uefi features. src/panic.rs is the panic handler: the crate's own prints
# through the firmware, which stops working after ExitBootServices.
uefi = { workspace = true }
